<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
    }

    #wrapper {
      display: flex;
      flex-direction: column;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* ── Nav Bar ── */
    #nav {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 48px;
      background: #1a1a2e;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    #nav-brand {
      color: #ffffff;
      font-weight: 700;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #nav-powered {
      color: rgba(255, 255, 255, 0.45);
      font-size: 11px;
      font-weight: 400;
    }

    /* ── Iframe area ── */
    #iframe-area {
      flex-grow: 1;
      position: relative;
      overflow: hidden;
    }

    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── Loading Overlay ── */
    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      z-index: 10;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #loading-overlay.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #1a73e8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-label {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.08em;
    }

    /* ── Auth Overlay ── */
    #auth-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      z-index: 20;
    }

    #auth-overlay.visible {
      display: flex;
    }

    .auth-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10), 0 1px 4px rgba(0, 0, 0, 0.06);
      padding: 36px 40px;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    .auth-card h2 {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
    }

    .auth-card p {
      margin: 0 0 24px;
      font-size: 14px;
      color: #64748b;
      line-height: 1.6;
    }

    #auth-btn {
      display: inline-block;
      padding: 11px 28px;
      background: #1a1a2e;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #auth-btn:hover {
      background: #2d2d4e;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <nav id="nav">
      <span id="nav-brand">{{BRAND_NAME}}</span>
      <span id="nav-powered">Powered by MedLegal Simplified</span>
    </nav>

    <div id="iframe-area">
      <iframe
        id="app-frame"
        src="{{GAS_DEPLOYMENT_URL}}"
        onload="onFrameLoad()"
        allow="same-origin"
        title="{{BRAND_NAME}} Case Manager"
      ></iframe>

      <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-label">LOADING...</div>
      </div>

      <div id="auth-overlay">
        <div class="auth-card">
          <h2>Sign in Required</h2>
          <p>Sign in with your Google account to continue. After signing in, return here and click Reload.</p>
          <button id="auth-btn" onclick="handleAuthClick()">Sign in with Google</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    var GAS_URL = '{{GAS_DEPLOYMENT_URL}}';
    var overlayHidden = false;
    var frameLoaded = false;

    function hideOverlay() {
      if (overlayHidden) return;
      overlayHidden = true;
      document.getElementById('loading-overlay').classList.add('loaded');
    }

    function showAuthOverlay() {
      document.getElementById('loading-overlay').classList.add('loaded');
      document.getElementById('auth-overlay').classList.add('visible');
    }

    function onFrameLoad() {
      frameLoaded = true;
      setTimeout(hideOverlay, 800);
    }

    // Phase 2 ready: listen for the GAS app's ready signal
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'cmc-ready') {
        hideOverlay();
      }
    });

    // Auth fallback: if iframe hasn't loaded after 12s, show sign-in card
    setTimeout(function() {
      if (!overlayHidden) {
        showAuthOverlay();
      }
    }, 12000);

    // Auth button: open GAS URL, then mutate to a reload button
    var authClicked = false;
    function handleAuthClick() {
      if (!authClicked) {
        authClicked = true;
        window.open(GAS_URL, '_blank');
        var btn = document.getElementById('auth-btn');
        btn.textContent = 'Signed in? Reload';
      } else {
        location.reload();
      }
    }
  </script>
</body>
</html>
